sources:
  my-mssql-source:
    kind: mssql
    host: 3.111.38.225
    port: 1433
    database: acp_swms
    user: sa
    password: "Mobillor@2021"

tools:
  search-items:
    kind: mssql-sql
    source: my-mssql-source
    description: Search for items based on item code or description.
    parameters:
      - name: name
        type: string
        description: The name of the item.
    statement: SELECT * FROM dbo.ITEM WHERE itemCode LIKE '%' + @name + '%' OR itemDescription LIKE '%' + @name + '%';

  execute-sql:
    kind: mssql-sql
    source: my-mssql-source
    description: Execute any safe (read-only) SQL query dynamically on MSSQL.
    parameters:
      - name: query
        type: string
        description: The SQL query to execute. Must start with SELECT.
    statement: |
      DECLARE @stmt NVARCHAR(MAX) = @query;
      -- Still executes a batch; rely on app-side guards to ensure single, read-only statements
      EXEC sp_executesql @stmt;


toolsets:

  sql-toolset:
    - execute-sql
    - search-items

