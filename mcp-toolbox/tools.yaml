sources:
  my-mssql-source:
    kind: mssql
    host: 3.111.38.225
    port: 1433
    database: swms
    user: sa
    password: "Mobillor@2021"

tools:
  search-items:
    kind: mssql-sql
    source: my-mssql-source
    description: Search for items based on item code or description.
    parameters:
      - name: name
        type: string
        description: The name of the item.
    statement: SELECT * FROM dbo.ITEM WHERE itemCode LIKE '%' + @name + '%' OR itemDescription LIKE '%' + @name + '%';

  execute-sql:
    kind: mssql-sql
    source: my-mssql-source
    description: Execute any safe (read-only) SQL query dynamically on MSSQL.
    parameters:
      - name: query
        type: string
        description: The SQL query to execute. Must start with SELECT.
    statement: |
      DECLARE @stmt NVARCHAR(MAX) = @query;
      -- Still executes a batch; rely on app-side guards to ensure single, read-only statements
      EXEC sp_executesql @stmt;

  search-hotels-by-name:
    kind: mssql-sql
    source: my-mssql-source
    description: Search for hotels based on name.
    parameters:
      - name: name
        type: string
        description: The name of the hotel.
    statement: SELECT * FROM hotels WHERE name LIKE '%' + @name + '%';

  search-hotels-by-location:
    kind: mssql-sql
    source: my-mssql-source
    description: Search for hotels based on location. Result is sorted by price from least to most expensive.
    parameters:
      - name: location
        type: string
        description: The location of the hotel.
    statement: |
      SELECT *
      FROM hotels
      WHERE location LIKE '%' + @location + '%'
      ORDER BY
        CASE price_tier
          WHEN 'Midscale' THEN 1
          WHEN 'Upper Midscale' THEN 2
          WHEN 'Upscale' THEN 3
          WHEN 'Upper Upscale' THEN 4
          WHEN 'Luxury' THEN 5
          ELSE 99
        END;

toolsets:

  sql-toolset:
    - execute-sql
    - search-items

  my_first_toolset:
    - search-hotels-by-name
    - search-hotels-by-location
 
